  <ellipse cx="100" cy="200" rx="60" ry="20" fill="#ddd" stroke="#999" stroke-width="2"/>
  <rect x="40" y="80" width="120" height="120" rx="20" fill="#4a90d9" stroke="#357abd" stroke-width="2"/>
  <ellipse cx="100" cy="80" rx="60" ry="15" fill="#5a9fe9" stroke="#357abd" stroke-width="2"/>
  <!-- Spout -->
  <path d="M160,110 Q180,100 175,80 L185,78 Q192,102 168,115" fill="#4a90d9" stroke="#357abd" stroke-width="2"/>
  <!-- Handle -->
