# nsjail.cfg — protobuf config for the DITA sandbox
#
# This file is an alternative to the command-line flags in sandbox_dita.sh.
# Use it with:
#   nsjail --config nsjail.cfg -- /bin/sh /run/sandbox-inner.sh COMMAND [ARGS]
#
# Adjust the mount{} blocks to match your actual DITA project path and system
# library layout before use.
#
# Reference: https://github.com/google/nsjail/blob/master/config.proto

name: "dita-sandbox"

# ── execution mode ────────────────────────────────────────────────────────────
# mode::ONCE — fork once, exec the command, then exit.
mode: ONCE

log_fd: 2
time_limit: 0        # no wall-clock timeout (resource limits applied externally)

# ── uid / gid mapping ─────────────────────────────────────────────────────────
# Map the current user as UID 1000 inside the jail.  Adjust if needed.
uidmap { inside_id: "1000" outside_id: "" count: 1 }
gidmap { inside_id: "1000" outside_id: "" count: 1 }

# ── namespaces ────────────────────────────────────────────────────────────────
clone_newnet:  true    # new network namespace — loopback only
clone_newpid:  true    # new PID namespace
clone_newuts:  true    # new UTS namespace (hostname isolation)
clone_newipc:  true    # new IPC namespace
clone_newns:   true    # new mount namespace

# ── capabilities ──────────────────────────────────────────────────────────────
# Drop all capabilities inside the jail.  The inner script only needs
# CAP_NET_ADMIN transiently (to bring up lo), but it can do that via 'ip link'
# as the ambient UID 0 → 1000 mapping prevents most misuse.
keep_caps: false

# ── filesystem isolation ──────────────────────────────────────────────────────
# chroot points to the minimal skeleton directory created by sandbox_dita.sh.
# The path below is a placeholder; sandbox_dita.sh overrides it at runtime via
# the --chroot command-line flag.
# chroot_dir: "/tmp/dita-sandbox-rootfs-XXXXXX"

# /tmp — writable scratch space
mount {
  dst: "/tmp"
  fstype: "tmpfs"
  rw: true
  is_bind: false
}

# /dev — minimal device filesystem
mount {
  dst: "/dev"
  fstype: "tmpfs"
  rw: true
  is_bind: false
}

# /proc — required by many JVM and Python tools
mount {
  src: "/proc"
  dst: "/proc"
  fstype: "proc"
  rw: false
  is_bind: false
}

# DITA project — the ONLY host data source the jail can read.
# Replace /opt/dita-ot with your actual project path.
mount {
  src: "/opt/dita-ot"
  dst: "/opt/dita-ot"
  is_bind: true
  rw: false        # read-only
}

# System binaries and libraries (read-only bind mounts from the host)
mount { src: "/usr"   dst: "/usr"   is_bind: true rw: false }
mount { src: "/bin"   dst: "/bin"   is_bind: true rw: false }
mount { src: "/sbin"  dst: "/sbin"  is_bind: true rw: false }
mount { src: "/lib"   dst: "/lib"   is_bind: true rw: false }
mount { src: "/lib64" dst: "/lib64" is_bind: true rw: false }

# Minimal /etc entries
mount { src: "/etc/ld.so.cache"   dst: "/etc/ld.so.cache"   is_bind: true rw: false }
mount { src: "/etc/ld.so.conf"    dst: "/etc/ld.so.conf"    is_bind: true rw: false }
mount { src: "/etc/passwd"        dst: "/etc/passwd"        is_bind: true rw: false }
mount { src: "/etc/group"         dst: "/etc/group"         is_bind: true rw: false }
mount { src: "/etc/nsswitch.conf" dst: "/etc/nsswitch.conf" is_bind: true rw: false }
mount { src: "/etc/localtime"     dst: "/etc/localtime"     is_bind: true rw: false }
mount { src: "/etc/ssl/certs"     dst: "/etc/ssl/certs"     is_bind: true rw: false }

# Inner wrapper script injected by sandbox_dita.sh
mount {
  src: "/tmp/dita-sandbox-inner-XXXXXX.sh"   # set by sandbox_dita.sh at runtime
  dst: "/run/sandbox-inner.sh"
  is_bind: true
  rw: false
}

# ── rlimits (informational — applied externally via prlimit) ──────────────────
# These mirror what sandbox_dita.sh sets through prlimit(1).
# Uncomment to also enforce them inside nsjail itself (belt-and-suspenders).
#
# rlimit_as:    1073741824   # 1 GiB virtual address space
# rlimit_nofile: 1024

# ── working directory ─────────────────────────────────────────────────────────
cwd: "/opt/dita-ot"   # must match DITA_PROJECT
