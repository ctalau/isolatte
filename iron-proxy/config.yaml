dns:
  listen: ":5353"
  proxy_ip: "127.0.0.1"
  passthrough: []

proxy:
  http_listen: ":4750"
  https_listen: ":4751"

tls:
  ca_cert: "/tmp/iron-proxy-ca.crt"
  ca_key: "/tmp/iron-proxy-ca.key"

transforms:
  - name: allowlist
    config:
      domains:
        - "example.com"

log:
  level: info
