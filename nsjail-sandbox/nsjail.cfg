# nsjail.cfg (hardened) — protobuf config for the DITA sandbox
#
# This is the config-file equivalent of sandbox_dita.sh.  It is useful when
# you want to drive nsjail directly rather than through the shell wrapper, or
# to audit the full static policy in one place.
#
# Dynamic values (ROOTFS path, DITA project path, inner script path) must be
# supplied on the command line as overrides:
#
#   nsjail --config nsjail.cfg \
#          --chroot /tmp/dita-rootfs-XXXX \
#          --bindmount_ro /data/myproject:/data/myproject \
#          --bindmount_ro /tmp/scripts/inner.sh:/run/inner.sh \
#          --cwd /data/myproject \
#          -- /bin/sh /run/inner.sh dita-ot.sh build
#
# Reference: https://github.com/google/nsjail/blob/master/config.proto
# Escape analysis: see ESCAPE_ANALYSIS.md

name: "dita-sandbox"

# ── execution mode ────────────────────────────────────────────────────────────
mode: ONCE
log_fd: 2
time_limit: 86400      # 24 h wall-clock backstop (E-18)

# ── UID / GID mapping ─────────────────────────────────────────────────────────
# Inside the user namespace the process starts as UID 0 (root-in-namespace).
# On the host it runs as the invoking user — no privilege gain.
# The inner script starts http.server then execs the DITA tool, both running
# as UID 0 within the jail's own namespaces only.
uidmap { inside_id: "0"  outside_id: "" count: 1 }
gidmap { inside_id: "0"  outside_id: "" count: 1 }

# ── namespaces ────────────────────────────────────────────────────────────────
clone_newuser: true    # E-13: user namespace — caps scoped to jail only
clone_newnet:  true    # new network namespace — loopback only
clone_newpid:  true    # new PID namespace — host PIDs invisible
clone_newipc:  true    # E-12: new IPC namespace — no shared SHM/queues
clone_newuts:  true    # new UTS namespace — jail hostname isolated
clone_newns:   true    # new mount namespace (implied by chroot, but explicit)

# ── capabilities ──────────────────────────────────────────────────────────────
# Drop all capabilities at the nsjail level.  The inner script still has
# CAP_NET_ADMIN and CAP_SYS_ADMIN within its own net/mount namespaces
# (because clone_newuser maps it as UID 0), but those caps are harmless
# outside the jail.  Seccomp (below) blocks the dangerous syscalls that
# would make even scoped caps exploitable.
keep_caps: false

# ── seccomp ───────────────────────────────────────────────────────────────────
# Load the deny-list policy from seccomp.policy (kafel format).
# When using this config file, pass the compiled policy string via:
#   --seccomp_string "$(cat seccomp.policy)"
# The field below is a placeholder comment; seccomp_string must be set at
# runtime because the protobuf format does not support file includes.
#
# seccomp_string: "<contents of seccomp.policy>"

# ── resource limits (E-06, E-07, E-08, E-17) ─────────────────────────────────
# Belt-and-suspenders: also enforced externally via prlimit(1) in the wrapper.
rlimit_as:      1073741824    # 1 GiB virtual address space
rlimit_nofile:  1024          # open file descriptors
rlimit_nproc:   256           # max spawned processes / threads  (E-06)
rlimit_cpu:     3600          # 1 CPU-hour hard cap              (E-07)
rlimit_fsize:   536870912     # 512 MiB max single file size     (E-08)

# ── filesystem ────────────────────────────────────────────────────────────────

# /tmp — writable scratch space, size-capped by the inner wrapper (E-05).
mount {
  dst: "/tmp"
  fstype: "tmpfs"
  options: "size=128m,nodev,nosuid,noexec"   # nodev: no device files (E-04)
  rw: true
  is_bind: false
}

# /dev — minimal device tmpfs; nodev prevents mknod from creating usable nodes.
mount {
  dst: "/dev"
  fstype: "tmpfs"
  options: "size=4m,nodev,nosuid"
  rw: true
  is_bind: false
}

# /proc — read-only (E-01).  The inner wrapper additionally bind-mounts
# /dev/null over the most dangerous entries.
mount {
  dst: "/proc"
  fstype: "proc"
  rw: false
  is_bind: false
}

# ── DITA project ──────────────────────────────────────────────────────────────
# Replace /opt/dita-ot with your actual project path (or pass via CLI --bindmount_ro).
# This is the ONLY host data source the jail may read.
mount {
  src: "/opt/dita-ot"
  dst: "/opt/dita-ot"
  is_bind: true
  rw: false
}

# ── system binaries and libraries (read-only) ─────────────────────────────────
# /sbin intentionally absent (E-09): iptables, insmod, modprobe not needed.
mount { src: "/usr"   dst: "/usr"   is_bind: true rw: false }
mount { src: "/bin"   dst: "/bin"   is_bind: true rw: false }
mount { src: "/lib"   dst: "/lib"   is_bind: true rw: false }
mount { src: "/lib64" dst: "/lib64" is_bind: true rw: false }

# ── dynamic linker ────────────────────────────────────────────────────────────
mount { src: "/etc/ld.so.cache"   dst: "/etc/ld.so.cache"   is_bind: true rw: false }
mount { src: "/etc/ld.so.conf"    dst: "/etc/ld.so.conf"    is_bind: true rw: false }
mount { src: "/etc/ld.so.conf.d"  dst: "/etc/ld.so.conf.d"  is_bind: true rw: false }

# ── timezone ──────────────────────────────────────────────────────────────────
mount { src: "/etc/localtime"         dst: "/etc/localtime"         is_bind: true rw: false }
mount { src: "/usr/share/zoneinfo"    dst: "/usr/share/zoneinfo"    is_bind: true rw: false }

# ── synthetic /etc (E-19) ─────────────────────────────────────────────────────
# Provided by sandbox_dita.sh from $ETC_DIR (two-entry passwd/group,
# empty resolv.conf).  Replace the src paths with the generated files.
mount { src: "/tmp/dita-etc/passwd"     dst: "/etc/passwd"     is_bind: true rw: false }
mount { src: "/tmp/dita-etc/group"      dst: "/etc/group"      is_bind: true rw: false }
mount { src: "/tmp/dita-etc/resolv.conf" dst: "/etc/resolv.conf" is_bind: true rw: false }

# /etc/ssl/certs/java only — full CA bundle excluded (E-16).
mount { src: "/etc/ssl/certs/java"  dst: "/etc/ssl/certs/java"  is_bind: true rw: false }

# ── inner wrapper script ──────────────────────────────────────────────────────
# Path set at runtime by sandbox_dita.sh.  Override via --bindmount_ro on CLI.
mount {
  src: "/tmp/scripts/inner.sh"   # placeholder — set via --bindmount_ro at runtime
  dst: "/run/inner.sh"
  is_bind: true
  rw: false
}

# ── working directory ─────────────────────────────────────────────────────────
cwd: "/opt/dita-ot"   # overridden at runtime via --cwd
